apiVersion: v1
kind: ServiceAccount
metadata:
  name: codepeer-runner
  namespace: codepeer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codepeer-runner-role
  namespace: codepeer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codepeer-runner-binding
  namespace: codepeer
subjects:
  - kind: ServiceAccount
    name: codepeer-runner
    namespace: codepeer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codepeer-runner-role

